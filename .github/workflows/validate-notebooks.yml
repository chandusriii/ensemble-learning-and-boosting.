name: Validate notebooks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate-notebook-format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install notebook validator
        run: python -m pip install nbformat
      - name: Validate notebook JSON and structure
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat
          paths = sorted(Path("notebooks").rglob("*.ipynb"))
          if not paths:
              raise SystemExit("No notebooks found")
          for path in paths:
              notebook = nbformat.read(path, as_version=4)
              nbformat.validate(notebook)
              print(f"Valid notebook format: {path}")
          PY
